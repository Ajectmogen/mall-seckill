server:
  port: 8185 # mall-1 副本，端口 +100

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall1?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  data:
    mongodb:
      host: localhost
      port: 27017
      database: mall-port1 # mall-1 副本隔离
    redis:
      host: localhost # Redis服务器地址
      database: 1 # mall-1 用 db1，与原项目(db0)隔离
      port: 6379 # Redis服务器连接端口
      password: # Redis服务器连接密码（默认为空）
      timeout: 300ms # 连接超时时间（毫秒）
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /mall
    username: mall
    password: mall

logging:
  level:
    root: info
    com.macro.mall: debug

# 秒杀 v2：异步建单开关（true=Lua预扣+排队落记录+MQ异步建单+结果轮询；false=v1 同步建单，压测对比用）
mall:
  flash:
    async-create: true

logstash:
  host: localhost
  enableInnerLog: false

alipay:
  gatewayUrl: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  appId: your appId
  alipayPublicKey: your alipayPublicKey
  appPrivateKey: your appPrivateKey
  returnUrl: http://localhost:5173/#/pages/money/paySuccess
  notifyUrl:

